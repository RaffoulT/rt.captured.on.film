<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gallery — Raffoul Traboulsy</title>

  <link rel="icon" type="image/png" href="images/favicon-mark.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap"
    rel="stylesheet">

  <style>

    :root {
      --paper: #E9E1CB;
      --paper-card: #F3EDDC;
      --paper-dark: #D8CCA9;
      --ink: #201C15;
      --ink-muted: #6E6353;
      --stamp: #AC3B2C;
      --teal: #2B554F;
      --line: #B7A97F;
      --radius: 2px;
    }


    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
    }


    html,
    body {
      overflow-x: hidden;
    }


    body {
      background: var(--paper);

      background-image:
        radial-gradient(
          circle at 1px 1px,
          rgba(32, 28, 21, 0.045) 1px,
          transparent 0
        );

      background-size: 22px 22px;

      color: var(--ink);

      font-family: 'IBM Plex Sans', sans-serif;

      line-height: 1.55;
    }


    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 1.75rem;
    }


    .mono {
      font-family: 'IBM Plex Mono', monospace;
    }


    /* =========================================================
       NAVIGATION
    ========================================================= */

    .gallery-nav {
      border-bottom: 2px solid var(--ink);

      padding: 1rem 0;

      font-family: 'IBM Plex Mono', monospace;

      font-size: 0.75rem;

      letter-spacing: .1em;

      text-transform: uppercase;
    }


    .nav-flex {
      display: flex;

      justify-content: space-between;

      align-items: center;
    }


    .back-btn {
      text-decoration: none;

      color: var(--stamp);

      font-weight: 600;
    }


    .back-btn:hover {
      text-decoration: underline;
    }


    /* =========================================================
       HEADER
    ========================================================= */

    .gallery-header {
      padding: 4rem 0 3rem;

      text-align: center;
    }


    .gallery-header h1 {
      font-family: 'Archivo Black', sans-serif;

      font-size: clamp(2rem, 5vw, 3.8rem);

      text-transform: uppercase;

      line-height: 1.1;

      margin-bottom: 1rem;
    }


    .gallery-meta {
      font-family: 'IBM Plex Mono', monospace;

      font-size: 0.8rem;

      color: var(--ink-muted);

      display: flex;

      justify-content: center;

      gap: 2rem;

      flex-wrap: wrap;
    }


    .gallery-meta span strong {
      color: var(--ink);
    }


    /* =========================================================
       GALLERY GRID
    ========================================================= */

    .photo-stream {
      display: grid;

      grid-template-columns: 1fr;

      gap: 3rem;

      padding-bottom: 6rem;
    }


    /* =========================================================
       FILM FRAME
    ========================================================= */

    .film-frame {
      background: var(--paper-card);

      border: 1px solid var(--line);

      border-radius: var(--radius);

      padding: 1.5rem;

      box-shadow:
        0 8px 20px -10px
        rgba(0, 0, 0, 0.15);
    }


    /* =========================================================
       HORIZONTAL FILM STRIP
       Default orientation
    ========================================================= */

    .sprocket-wrapper {
      position: relative;

      width: 100%;

      aspect-ratio: 4 / 3;

      background: #1a1713;

      border: 1px solid var(--ink);

      overflow: hidden;
    }


    /*
     * Horizontal film strip:
     * sprocket holes across the top and bottom.
     */

    .sprocket-wrapper::before,
    .sprocket-wrapper::after {

      content: '';

      position: absolute;

      left: 0;

      right: 0;

      height: 12px;

      background-color: var(--ink);

      background-image:
        repeating-linear-gradient(
          90deg,
          var(--paper-card) 0 6px,
          transparent 6px 18px
        );

      z-index: 2;
    }


    .sprocket-wrapper::before {
      top: 0;
    }


    .sprocket-wrapper::after {
      bottom: 0;
    }


    /*
     * Horizontal photograph area.
     */

    .sprocket-wrapper img {
      position: absolute;

      inset: 12px 0;

      width: 100%;

      height: calc(100% - 24px);

      object-fit: contain;
    }


    /* =========================================================
       VERTICAL FILM STRIP
    ========================================================= */

    /*
     * JavaScript adds .portrait when:

       naturalHeight > naturalWidth

     * This changes the film strip from horizontal
     * to vertical automatically.
     */

    .sprocket-wrapper.portrait {
      aspect-ratio: 3 / 4;

      max-width: 720px;

      margin-left: auto;

      margin-right: auto;
    }


    /*
     * Vertical sprocket holes:
     * holes now run down the left and right sides.
     */

    .sprocket-wrapper.portrait::before,
    .sprocket-wrapper.portrait::after {

      top: 0;

      bottom: 0;

      left: auto;

      right: auto;

      width: 12px;

      height: 100%;

      background-image:
        repeating-linear-gradient(
          180deg,
          var(--paper-card) 0 6px,
          transparent 6px 18px
        );
    }


    .sprocket-wrapper.portrait::before {
      left: 0;
    }


    .sprocket-wrapper.portrait::after {
      right: 0;
    }


    /*
     * Vertical photograph area.

     * The image is inset from the left/right
     * sprocket holes rather than top/bottom.
     */

    .sprocket-wrapper.portrait img {

      inset: 0 12px;

      width: calc(100% - 24px);

      height: 100%;

      object-fit: contain;
    }


    /* =========================================================
       EXPAND BUTTON
    ========================================================= */

    .expand-btn {
      width: 100%;

      margin-top: 0.8rem;

      padding: 0.7rem 1rem;

      background: transparent;

      color: var(--ink);

      border: 1px solid var(--line);

      border-radius: var(--radius);

      font-family: 'IBM Plex Mono', monospace;

      font-size: 0.7rem;

      letter-spacing: .08em;

      text-transform: uppercase;

      cursor: pointer;

      transition:
        background .2s ease,
        color .2s ease,
        border-color .2s ease,
        transform .2s ease;
    }


    .expand-btn:hover {
      background: var(--ink);

      color: var(--paper-card);

      border-color: var(--ink);

      transform: translateY(-1px);
    }


    .expand-btn:active {
      transform: translateY(0);
    }


    /* =========================================================
       CAPTION
    ========================================================= */

    .caption {
      margin-top: 1.2rem;

      font-family: 'IBM Plex Mono', monospace;

      font-size: 0.8rem;

      color: var(--ink-muted);

      display: flex;

      justify-content: space-between;

      gap: 1rem;

      border-top: 1px dotted var(--line);

      padding-top: 0.8rem;
    }


    .empty {
      text-align: center;

      padding: 4rem 0;

      color: var(--ink-muted);

      font-family: 'IBM Plex Mono', monospace;
    }


    /* =========================================================
       FULLSCREEN IMAGE VIEWER
    ========================================================= */

    .image-viewer {
      position: fixed;

      inset: 0;

      z-index: 9999;

      background: rgba(20, 17, 13, 0.96);

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 2rem;

      opacity: 0;

      visibility: hidden;

      transition:
        opacity .25s ease,
        visibility .25s ease;
    }


    .image-viewer.active {
      opacity: 1;

      visibility: visible;
    }


    .viewer-content {
      position: relative;

      width: min(94vw, 1400px);

      height: min(94vh, 1000px);

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;
    }


    .viewer-image {
      max-width: 100%;

      max-height: calc(100% - 70px);

      width: auto;

      height: auto;

      object-fit: contain;

      border: 1px solid rgba(243, 237, 220, 0.25);

      box-shadow:
        0 25px 60px
        rgba(0, 0, 0, 0.55);

      transition:
        transform .25s ease;
    }


    .viewer-caption {
      margin-top: 1rem;

      max-width: 90%;

      color: var(--paper-card);

      font-family: 'IBM Plex Mono', monospace;

      font-size: .8rem;

      text-align: center;

      letter-spacing: .04em;
    }


    .viewer-frame {
      color: var(--line);

      font-family: 'IBM Plex Mono', monospace;

      font-size: .65rem;

      text-transform: uppercase;

      letter-spacing: .1em;

      margin-bottom: .3rem;
    }


    .viewer-close {
      position: absolute;

      top: 0;

      right: 0;

      border: 1px solid var(--line);

      background: var(--paper-card);

      color: var(--ink);

      padding: .55rem .8rem;

      font-family: 'IBM Plex Mono', monospace;

      font-size: .7rem;

      letter-spacing: .06em;

      text-transform: uppercase;

      cursor: pointer;

      z-index: 3;

      transition:
        background .2s ease,
        color .2s ease;
    }


    .viewer-close:hover {
      background: var(--stamp);

      color: white;

      border-color: var(--stamp);
    }


    /* =========================================================
       FOOTER
    ========================================================= */

    footer {
      border-top: 2px solid var(--ink);

      padding: 2.5rem 0;

      text-align: center;

      font-family: 'IBM Plex Mono', monospace;

      font-size: .7rem;

      color: var(--ink-muted);
    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 600px) {

      .wrap {
        padding: 0 1rem;
      }


      .nav-flex {
        gap: 1rem;
      }


      .gallery-header {
        padding: 3rem 0 2.5rem;
      }


      .gallery-meta {
        gap: .8rem 1.2rem;
      }


      .film-frame {
        padding: 1rem;
      }


      .photo-stream {
        gap: 2rem;
      }


      .caption {
        flex-direction: column;

        gap: .3rem;
      }


      .image-viewer {
        padding: 1rem;
      }


      .viewer-content {
        width: 100%;

        height: 100%;
      }


      .viewer-image {
        max-width: 100%;

        max-height: calc(100% - 80px);
      }


      .viewer-close {
        top: .5rem;

        right: .5rem;
      }


      .viewer-caption {
        font-size: .7rem;
      }


      /*
       * Give portrait strips a little more
       * room on smaller screens.
       */

      .sprocket-wrapper.portrait {
        max-width: 90%;
      }

    }


    /* =========================================================
       REDUCED MOTION
    ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      .image-viewer,
      .expand-btn {
        transition: none;
      }

    }

  </style>

</head>

<div class="viewer-content">

  </div>

   <!-- =========================================================
       FILM ROLL AUDIO + SFX SETTING
  ========================================================= -->

  <audio
    id="roll-audio"
    src="audio/film-roll.mp3"
    preload="auto">
  </audio>

  <script>

    (() => {

      'use strict';

      /* =========================================================
         SFX SETTING
         Uses the same localStorage key as index.html
      ========================================================= */

      const soundEnabled =
        localStorage.getItem('sfxEnabled') !== 'false';


      /* =========================================================
         FILM ROLL AUDIO
      ========================================================= */

      const rollAudio =
        document.getElementById('roll-audio');


      const backBtn =
        document.querySelector('.back-btn');


      if (backBtn) {

        backBtn.addEventListener(
          'click',
          (e) => {

            /*
             * Keep normal behaviour for
             * Ctrl/Cmd/Middle click.
             */

            if (
              e.ctrlKey ||
              e.metaKey ||
              e.shiftKey ||
              e.button !== 0
            ) {

              return;

            }


            e.preventDefault();


            const targetUrl =
              backBtn.href;


            /*
             * Only play the film-roll sound
             * if SFX is enabled in index.html.
             */

            if (soundEnabled) {

              rollAudio.currentTime = 0;


              rollAudio
                .play()
                .catch(
                  err =>
                    console.log(
                      'Audio play blocked by browser:',
                      err
                    )
                );


              /*
               * Wait for the sound before
               * returning to the catalogue.
               */

              setTimeout(
                () => {

                  window.location.href =
                    targetUrl;

                },
                700
              );

            } else {

              /*
               * If SFX is OFF, go back immediately.
               */

              window.location.href =
                targetUrl;

            }

          }
        );

      }

    })();

  </script>
  <!-- =======================================================
       JAVASCRIPT
  ======================================================= -->

  <script>

    (() => {

      'use strict';


      /* =========================================================
         BASIC HELPERS
      ========================================================= */

      const STORAGE_KEY = 'rtCatalogCards';


      const $ = id =>
        document.getElementById(id);


      const escapeHtml = (s) => {

        return String(
          s == null ? '' : s
        )

          .replace(/&/g, '&amp;')

          .replace(/</g, '&lt;')

          .replace(/>/g, '&gt;')

          .replace(/"/g, '&quot;')

          .replace(/'/g, '&#39;');

      };



      /* =========================================================
         DEFAULT CARD
      ========================================================= */

      const DEFAULT_CARDS = [

        {

          code: 'ROLL — 01',

          category: 'series',

          title: 'Gold 200',

          image: 'images/kodak-gold-200.avif',

          alt: 'Kodak Gold 200 film retail package',

          frameNum: '14A',

          location: 'Beirut, LB',

          year: '2026',

          format: '35mm Film',

          description:
            'Quiet Shelves Hiding a lot of treasures.',

          link:
            'gallery.html?i=0',

          linkText:
            'View gallery →',


          photos: [

            {
              image: 'images/a-9.avif',
              alt: 'CEOs picture',
              caption: 'The Madman Behind the Lens'
            },

            {
              image: 'images/a-4.avif',
              alt: 'jen',
              caption: '10452 km² of heart.'
            },

            {
              image: 'images/a-14.avif',
              alt: 'Lanlun',
              caption: 'Wrapped in Babylon blue'
            },

            {
              image: 'images/Untitled-4.avif',
              alt: 'brrrrrrrrrrrrr',
              caption: 'Arguing with the wind'
            },

            {
              image: 'images/Untitled-3.avif',
              alt: 'Music Speaks Louder than Words',
              caption: 'Music Speaks Louder Than Words'
            },

            {
              image: 'images/Untitled-2.avif',
              alt: 'Hidden inside these books are secrets',
              caption: 'Knowledge hidden within the shelves'
            },

            {
              image: 'images/Untitled-1.avif',
              alt: 'Just the exhausts poluting the air',
              caption: 'Pollution In An Artistic Way'
            }

          ]

        }

      ];



      /* =========================================================
         LOAD CARDS
         
         Priority:
         1. localStorage admin cards
         2. cards.json
         3. built-in fallback
      ========================================================= */

      const loadCards = async () => {

        /*
         * First check localStorage.
         */

        let storedCards = null;


        try {

          const raw =
            localStorage.getItem(
              STORAGE_KEY
            );


          if (raw) {

            const parsed =
              JSON.parse(raw);


            if (Array.isArray(parsed)) {

              storedCards = parsed;

            }

          }

        } catch (e) {

          console.warn(
            'Could not read saved catalogue cards.',
            e
          );

        }


        /*
         * If localStorage contains cards,
         * use them.
         */

        if (storedCards) {

          return storedCards;

        }


        /*
         * Otherwise load the exact
         * cards.json file.
         */

        try {

          const response =
            await fetch('cards.json', {
              cache: 'no-store'
            });


          if (!response.ok) {

            throw new Error(
              `HTTP ${response.status}`
            );

          }


          const json =
            await response.json();


          if (Array.isArray(json)) {

            return json;

          }

        } catch (e) {

          console.warn(
            'Could not load cards.json. Using fallback data.',
            e
          );

        }


        /*
         * Final fallback.
         */

        return JSON.parse(
          JSON.stringify(DEFAULT_CARDS)
        );

      };



      /* =========================================================
         URL PARAMETER
      ========================================================= */

      const getParam = (name) => {

        const params =
          new URLSearchParams(
            window.location.search
          );


        return params.get(name);

      };



      /* =========================================================
         IMAGE ORIENTATION DETECTION
      ========================================================= */

      const detectOrientation = (img) => {

        const wrapper =
          img.closest(
            '.sprocket-wrapper'
          );


        if (!wrapper) {
          return;
        }


        /*
         * naturalWidth and naturalHeight
         * represent the REAL dimensions of
         * the source image.
         */

        if (
          img.naturalWidth > 0 &&
          img.naturalHeight > 0
        ) {

          if (
            img.naturalHeight >
            img.naturalWidth
          ) {

            wrapper.classList.add(
              'portrait'
            );

          } else {

            wrapper.classList.remove(
              'portrait'
            );

          }

        }

      };



      /* =========================================================
         APPLY IMAGE ORIENTATION DETECTION
      ========================================================= */

      const setupOrientationDetection = () => {

        const images =
          document.querySelectorAll(
            '.sprocket-wrapper img'
          );


        images.forEach((img) => {

          /*
           * If the browser already knows the
           * dimensions, detect immediately.
           */

          if (img.complete) {

            detectOrientation(img);

          }


          /*
           * Otherwise wait until the image
           * has finished loading.
           */

          img.addEventListener(
            'load',
            () => {

              detectOrientation(img);

            },
            {
              once: true
            }
          );


          /*
           * If an image fails, keep the
           * default horizontal frame.
           */

          img.addEventListener(
            'error',
            () => {

              const wrapper =
                img.closest(
                  '.sprocket-wrapper'
                );


              if (wrapper) {

                wrapper.classList.remove(
                  'portrait'
                );

              }

            },
            {
              once: true
            }
          );

        });

      };



      /* =========================================================
         MAIN GALLERY INITIALIZATION
      ========================================================= */

      const initGallery = async () => {

        const cards =
          await loadCards();


        let idx =
          parseInt(
            getParam('i'),
            10
          );


        let card =
          (!isNaN(idx) && cards[idx])
            ? cards[idx]
            : null;



        /* -------------------------------------------------------
           LOOKUP BY CODE
        ------------------------------------------------------- */

        if (!card) {

          const code =
            getParam('code');


          if (code) {

            for (
              let k = 0;
              k < cards.length;
              k++
            ) {

              if (
                cards[k].code === code
              ) {

                card = cards[k];

                idx = k;

                break;

              }

            }

          }

        }



        /* -------------------------------------------------------
           GALLERY NOT FOUND
        ------------------------------------------------------- */

        if (!card) {

          $('galTitle').textContent =
            'Gallery not found';


          $('photoStream').innerHTML =
            '<div class="empty">This gallery link is missing or the card no longer exists.</div>';


          return;

        }



        /* -------------------------------------------------------
           GALLERY INFORMATION
        ------------------------------------------------------- */

        document.title =
          `${card.title || 'Gallery'} — Raffoul Traboulsy`;


        $('galTitle').textContent =
          card.title || 'Gallery';


        $('galLocation').textContent =
          card.location || '—';


        $('galFormat').textContent =
          card.format || '—';


        $('galYear').textContent =
          card.year || '—';


        $('navCode').textContent =
          card.code || 'Catalogue';


        $('footCode').textContent =
          card.code || 'Catalogue';



        /* -------------------------------------------------------
           PHOTOS
        ------------------------------------------------------- */

        let photos =
          Array.isArray(card.photos)
            ? [...card.photos]
            : [];



        /*
         * Fallback to the card's cover image
         * if there are no photos.
         */

        if (
          !photos.length &&
          card.image
        ) {

          photos = [

            {

              image: card.image,

              alt:
                card.alt ||
                card.title ||
                '',

              caption:
                card.title ||
                ''

            }

          ];

        }



        const stream =
          $('photoStream');



        /* -------------------------------------------------------
           NO PHOTOS
        ------------------------------------------------------- */

        if (!photos.length) {

          stream.innerHTML =
            '<div class="empty">No photos have been added to this card yet.</div>';


          return;

        }



        /* -------------------------------------------------------
           RENDER PHOTOS
        ------------------------------------------------------- */

        stream.innerHTML =
          photos.map((p, i) => {

            const frameLabel =
              `Frame // ${String(
                i + 1
              ).padStart(2, '0')}A`;


            return `

              <div class="film-frame">

                <div class="sprocket-wrapper">

                  <img
                    src="${escapeHtml(p.image)}"
                    alt="${escapeHtml(p.alt || '')}"
                    loading="lazy">

                </div>


                <button
                  type="button"
                  class="expand-btn"

                  data-image="${escapeHtml(
                    p.image
                  )}"

                  data-alt="${escapeHtml(
                    p.alt || ''
                  )}"

                  data-caption="${escapeHtml(
                    p.caption || ''
                  )}"

                  data-frame="${escapeHtml(
                    frameLabel
                  )}">

                  ⛶ Expand

                </button>


                <div class="caption">

                  <span>
                    ${escapeHtml(
                      frameLabel
                    )}
                  </span>

                  <span>
                    ${escapeHtml(
                      p.caption || ''
                    )}
                  </span>

                </div>

              </div>

            `;

          }).join('');



        /*
         * Start automatic orientation detection
         * after rendering the images.
         */

        setupOrientationDetection();

      };



      /* =========================================================
         FULLSCREEN IMAGE VIEWER
      ========================================================= */

      const imageViewer =
        $('imageViewer');


      const viewerImage =
        $('viewerImage');


      const viewerCaption =
        $('viewerCaption');


      const viewerFrame =
        $('viewerFrame');


      const viewerClose =
        $('viewerClose');



      /* ---------------------------------------------------------
         OPEN VIEWER
      --------------------------------------------------------- */

      const openViewer = (
        image,
        alt,
        caption,
        frame
      ) => {

        viewerImage.src =
          image;


        viewerImage.alt =
          alt || '';


        viewerCaption.textContent =
          caption || '';


        viewerFrame.textContent =
          frame || '';


        imageViewer.classList.add(
          'active'
        );


        document.body.style.overflow =
          'hidden';


        viewerClose.focus();

      };



      /* ---------------------------------------------------------
         CLOSE VIEWER
      --------------------------------------------------------- */

      const closeViewer = () => {

        imageViewer.classList.remove(
          'active'
        );


        document.body.style.overflow =
          '';


        setTimeout(() => {

          if (
            !imageViewer.classList.contains(
              'active'
            )
          ) {

            viewerImage.src = '';

          }

        }, 250);

      };



      /* ---------------------------------------------------------
         EXPAND BUTTON
      --------------------------------------------------------- */

      document.addEventListener(
        'click',
        (e) => {

          const button =
            e.target.closest(
              '.expand-btn'
            );


          if (!button) {
            return;
          }


          openViewer(

            button.dataset.image,

            button.dataset.alt,

            button.dataset.caption,

            button.dataset.frame

          );

        }
      );



      /* ---------------------------------------------------------
         CLOSE BUTTON
      --------------------------------------------------------- */

      viewerClose.addEventListener(
        'click',
        closeViewer
      );



      /* ---------------------------------------------------------
         CLICK OUTSIDE IMAGE
      --------------------------------------------------------- */

      imageViewer.addEventListener(
        'click',
        (e) => {

          if (
            e.target === imageViewer
          ) {

            closeViewer();

          }

        }
      );



      /* ---------------------------------------------------------
         ESCAPE KEY
      --------------------------------------------------------- */

      document.addEventListener(
        'keydown',
        (e) => {

          if (
            e.key === 'Escape' &&
            imageViewer.classList.contains(
              'active'
            )
          ) {

            closeViewer();

          }

        }
      );



      /* =========================================================
         FILM ROLL AUDIO
      ========================================================= */

      const rollAudio =
        document.getElementById(
          'roll-audio'
        );


      const backBtn =
        document.querySelector(
          '.back-btn'
        );


      if (backBtn) {

        backBtn.addEventListener(
          'click',
          (e) => {

            /*
             * Preserve browser behaviour for
             * Ctrl/Cmd/middle-click.
             */

            if (
              e.ctrlKey ||
              e.metaKey ||
              e.shiftKey ||
              e.button !== 0
            ) {

              return;

            }


            e.preventDefault();


            const targetUrl =
              backBtn.href;


            rollAudio.currentTime =
              0;


            rollAudio
              .play()
              .catch(
                err =>
                  console.log(
                    'Audio play blocked by browser:',
                    err
                  )
              );


            setTimeout(
              () => {

                window.location.href =
                  targetUrl;

              },
              700
            );

          }
        );

      }



      /* =========================================================
         START GALLERY
      ========================================================= */

      initGallery();

    })();

  </script>

</body>

</html>
