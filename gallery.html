<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gallery — Raffoul Traboulsy</title>

  <link rel="icon" type="image/png" href="images/favicon-mark.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap"
    rel="stylesheet">

  <style>

    :root {
      --paper: #E9E1CB;
      --paper-card: #F3EDDC;
      --paper-dark: #D8CCA9;
      --ink: #201C15;
      --ink-muted: #6E6353;
      --stamp: #AC3B2C;
      --teal: #2B554F;
      --line: #B7A97F;
      --radius: 2px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    html,
    body {
      overflow-x: hidden;
    }

    body {
      background: var(--paper);

      background-image:
        radial-gradient(
          circle at 1px 1px,
          rgba(32, 28, 21, 0.045) 1px,
          transparent 0
        );

      background-size: 22px 22px;

      color: var(--ink);

      font-family: 'IBM Plex Sans', sans-serif;

      line-height: 1.55;
    }

    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 1.75rem;
    }

    .mono {
      font-family: 'IBM Plex Mono', monospace;
    }


    /* =====================================================
       NAVIGATION
       ===================================================== */

    .gallery-nav {
      border-bottom: 2px solid var(--ink);

      padding: 1rem 0;

      font-family: 'IBM Plex Mono', monospace;

      font-size: .75rem;

      letter-spacing: .1em;

      text-transform: uppercase;
    }

    .nav-flex {
      display: flex;

      justify-content: space-between;

      align-items: center;
    }

    .back-btn {
      text-decoration: none;

      color: var(--stamp);

      font-weight: 600;
    }

    .back-btn:hover {
      text-decoration: underline;
    }


    /* =====================================================
       HEADER
       ===================================================== */

    .gallery-header {
      padding: 4rem 0 3rem;

      text-align: center;
    }

    .gallery-header h1 {
      font-family: 'Archivo Black', sans-serif;

      font-size: clamp(2rem, 5vw, 3.8rem);

      text-transform: uppercase;

      line-height: 1.1;

      margin-bottom: 1rem;
    }

    .gallery-meta {
      font-family: 'IBM Plex Mono', monospace;

      font-size: .8rem;

      color: var(--ink-muted);

      display: flex;

      justify-content: center;

      gap: 2rem;

      flex-wrap: wrap;
    }

    .gallery-meta span strong {
      color: var(--ink);
    }


    /* =====================================================
       GALLERY GRID
       ===================================================== */

    .photo-stream {
      display: grid;

      grid-template-columns: 1fr;

      gap: 3rem;

      padding-bottom: 6rem;
    }


    /* =====================================================
       FILM FRAME CARD
       ===================================================== */

    .film-frame {
      background: var(--paper-card);

      border: 1px solid var(--line);

      border-radius: var(--radius);

      padding: 1.5rem;

      box-shadow:
        0 8px 20px -10px
        rgba(0, 0, 0, .15);
    }


    /* =====================================================
       FILM STRIP
    ===================================================== */

    .sprocket-wrapper {
      position: relative;

      width: 100%;

      aspect-ratio: 4 / 3;

      background: #1a1713;

      border: 1px solid var(--ink);

      overflow: hidden;

      display: flex;

      align-items: center;

      justify-content: center;
    }


    /* Horizontal film strip */

    .sprocket-wrapper.landscape {
      aspect-ratio: 4 / 3;
    }


    /* Vertical film strip */

    .sprocket-wrapper.portrait {
      aspect-ratio: 3 / 4;
    }


    .sprocket-wrapper::before,
    .sprocket-wrapper::after {
      content: '';

      position: absolute;

      z-index: 2;

      background-color: var(--ink);

      background-image:
        repeating-linear-gradient(
          90deg,
          var(--paper-card) 0 6px,
          transparent 6px 18px
        );
    }


    /* Horizontal strip sprockets */

    .sprocket-wrapper.landscape::before,
    .sprocket-wrapper.landscape::after {

      left: 0;

      right: 0;

      height: 12px;
    }

    .sprocket-wrapper.landscape::before {
      top: 0;
    }

    .sprocket-wrapper.landscape::after {
      bottom: 0;
    }


    /* Vertical strip sprockets */

    .sprocket-wrapper.portrait::before,
    .sprocket-wrapper.portrait::after {

      top: 0;

      bottom: 0;

      width: 12px;

      height: auto;

      background-image:
        repeating-linear-gradient(
          0deg,
          var(--paper-card) 0 6px,
          transparent 6px 18px
        );
    }

    .sprocket-wrapper.portrait::before {
      left: 0;
    }

    .sprocket-wrapper.portrait::after {
      right: 0;
    }


    /* =====================================================
       IMAGE
       ===================================================== */

    .sprocket-wrapper img {
      position: absolute;

      width: 100%;

      height: 100%;

      object-fit: contain;

      display: block;
    }


    /* Horizontal image */

    .sprocket-wrapper.landscape img {
      inset: 12px 0;

      width: 100%;

      height: calc(100% - 24px);
    }


    /* Vertical image */

    .sprocket-wrapper.portrait img {
      inset: 0 12px;

      width: calc(100% - 24px);

      height: 100%;
    }


    /* =====================================================
       EXPAND BUTTON
       ===================================================== */

    .expand-btn {
      width: 100%;

      margin-top: .8rem;

      padding: .7rem 1rem;

      background: transparent;

      color: var(--ink);

      border: 1px solid var(--line);

      border-radius: var(--radius);

      font-family: 'IBM Plex Mono', monospace;

      font-size: .7rem;

      letter-spacing: .08em;

      text-transform: uppercase;

      cursor: pointer;

      transition:
        background .2s ease,
        color .2s ease,
        border-color .2s ease,
        transform .2s ease;
    }

    .expand-btn:hover {
      background: var(--ink);

      color: var(--paper-card);

      border-color: var(--ink);

      transform: translateY(-1px);
    }

    .expand-btn:active {
      transform: translateY(0);
    }


    /* =====================================================
       CAPTION
       ===================================================== */

    .caption {
      margin-top: 1.2rem;

      font-family: 'IBM Plex Mono', monospace;

      font-size: .8rem;

      color: var(--ink-muted);

      display: flex;

      justify-content: space-between;

      gap: 1rem;

      border-top: 1px dotted var(--line);

      padding-top: .8rem;
    }


    /* =====================================================
       EMPTY STATE
       ===================================================== */

    .empty {
      text-align: center;

      padding: 4rem 0;

      color: var(--ink-muted);

      font-family: 'IBM Plex Mono', monospace;
    }


    /* =====================================================
       FULLSCREEN VIEWER
       ===================================================== */

    .image-viewer {
      position: fixed;

      inset: 0;

      z-index: 9999;

      background: rgba(20, 17, 13, .96);

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 2rem;

      opacity: 0;

      visibility: hidden;

      transition:
        opacity .25s ease,
        visibility .25s ease;
    }

    .image-viewer.active {
      opacity: 1;

      visibility: visible;
    }

    .viewer-content {
      position: relative;

      width: min(94vw, 1400px);

      height: min(94vh, 1000px);

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;
    }

    .viewer-image {
      max-width: 100%;

      max-height: calc(100% - 70px);

      width: auto;

      height: auto;

      object-fit: contain;

      border: 1px solid
        rgba(243, 237, 220, .25);

      box-shadow:
        0 25px 60px
        rgba(0, 0, 0, .55);
    }

    .viewer-caption {
      margin-top: 1rem;

      max-width: 90%;

      color: var(--paper-card);

      font-family: 'IBM Plex Mono', monospace;

      font-size: .8rem;

      text-align: center;

      letter-spacing: .04em;
    }

    .viewer-frame {
      color: var(--line);

      font-family: 'IBM Plex Mono', monospace;

      font-size: .65rem;

      text-transform: uppercase;

      letter-spacing: .1em;

      margin-bottom: .3rem;
    }

    .viewer-close {
      position: absolute;

      top: 0;

      right: 0;

      border: 1px solid var(--line);

      background: var(--paper-card);

      color: var(--ink);

      padding: .55rem .8rem;

      font-family: 'IBM Plex Mono', monospace;

      font-size: .7rem;

      letter-spacing: .06em;

      text-transform: uppercase;

      cursor: pointer;

      z-index: 3;

      transition:
        background .2s ease,
        color .2s ease;
    }

    .viewer-close:hover {
      background: var(--stamp);

      color: white;

      border-color: var(--stamp);
    }


    /* =====================================================
       FOOTER
       ===================================================== */

    footer {
      border-top: 2px solid var(--ink);

      padding: 2.5rem 0;

      text-align: center;

      font-family: 'IBM Plex Mono', monospace;

      font-size: .7rem;

      color: var(--ink-muted);
    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 600px) {

      .wrap {
        padding: 0 1rem;
      }

      .nav-flex {
        gap: 1rem;
      }

      .gallery-header {
        padding: 3rem 0 2.5rem;
      }

      .gallery-meta {
        gap: .8rem 1.2rem;
      }

      .film-frame {
        padding: 1rem;
      }

      .photo-stream {
        gap: 2rem;
      }

      .caption {
        flex-direction: column;

        gap: .3rem;
      }

      .image-viewer {
        padding: 1rem;
      }

      .viewer-content {
        width: 100%;

        height: 100%;
      }

      .viewer-image {
        max-width: 100%;

        max-height: calc(100% - 80px);
      }

      .viewer-close {
        top: .5rem;

        right: .5rem;
      }

      .viewer-caption {
        font-size: .7rem;
      }

    }


    /* =====================================================
       REDUCED MOTION
       ===================================================== */

    @media (prefers-reduced-motion: reduce) {

      .image-viewer,
      .expand-btn {
        transition: none;
      }

    }

  </style>

</head>

<body>

  <!-- =====================================================
       NAVIGATION
       ===================================================== -->

  <nav class="gallery-nav">


<div class="wrap nav-flex">

  <a
    href="index.html"
    class="back-btn">

    ← Back to Catalogue

  </a>


  <span id="navCode">

    Catalogue No. 001

  </span>

</div>


  </nav>

  <!-- =====================================================
       GALLERY HEADER
       ===================================================== -->

  <header class="gallery-header">


<div class="wrap">

  <h1 id="galTitle">

    Gallery

  </h1>


  <div class="gallery-meta">

    <span>

      Location:

      <strong id="galLocation">

      </strong>

    </span>


    <span>

      Format:

  <main class="wrap">

  <!-- =====================================================

  <footer>


<div class="wrap">

    <span id="footCode">

</div>


  </footer>

  <!-- =====================================================

       ===================================================== -->

  <div
    class="image-viewer"

    role="dialog"
    aria-modal="true"

<div class="viewer-content">

  <button

    Close [X]

  </button>


  <img

  <div class="viewer-caption">

</div>


  </div>

  <!-- =====================================================
       AUDIO
       
       preload="none" is intentional.
       The browser will not preload the sound.
       JavaScript only calls play() when SFX is ON.
       ===================================================== -->

<audio
 id="roll-audio"
 src="audio/film-roll.mp3"
 preload="none"> </audio>

  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script>

    (() => {

      'use strict';


      /* =====================================================
         BASIC HELPERS
         ===================================================== */

      const STORAGE_KEY =
        'rtCatalogCards';


      const SFX_KEY =
        'sfxEnabled';


      const $ =
        id =>
          document.getElementById(id);


      const escapeHtml = (value) => {

        return String(
          value == null ? '' : value
        )

          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');

      };


      /* =====================================================
         DEFAULT DATA
         
         Used only if localStorage is unavailable.
         Normal operation loads cards.json.
         ===================================================== */

      const DEFAULT_CARDS = [

        {

          code: 'ROLL — 01',

          category: 'series',

          title: 'Gold 200',

          image:
            'images/kodak-gold-200.avif',

          alt:
            'Kodak Gold 200 film retail package',

          frameNum: '14A',

          location:
            'Beirut, LB',

          year:
            '2026',

          format:
            '35mm Film',

          description:
            'Quiet Shelves Hiding a lot of treasures.',

          link:
            'gallery.html?i=0',

          linkText:
            'View gallery →',

          photos: [

            {
              image: 'images/a-9.avif',
              alt: 'CEOs picture',
              caption:
                'The Madman Behind the Lens'
            },

            {
              image: 'images/a-4.avif',
              alt: 'jen',
              caption:
                '10452 km² of heart.',
              orientation: 'portrait'
            },

            {
              image: 'images/a-14.avif',
              alt: 'Lanlun',
              caption:
                'Wrapped in Babylon blue'
            },

            {
              image: 'images/Untitled-4.avif',
              alt: 'brrrrrrrrrrrrr',
              caption:
                'Arguing with the wind'
            },

            {
              image: 'images/Untitled-3.avif',
              alt:
                'Music Speaks Louder than Words',
              caption:
                'Music Speaks Louder Than Words'
            },

            {
              image: 'images/Untitled-2.avif',
              alt:
                'Hidden inside these books are secrets',
              caption:
                'Knowledge hidden within the shelves'
            },

            {
              image: 'images/Untitled-1.avif',
              alt:
                'Just the exhausts poluting the air',
              caption:
                'Pollution In An Artistic Way'
            }

          ]

        }

      ];


      /* =====================================================
         LOAD CARDS FROM LOCAL STORAGE
         ===================================================== */

      const loadLocalCards = () => {

        try {

          const raw =
            localStorage.getItem(
              STORAGE_KEY
            );


          if (!raw) {
            return null;
          }


          const parsed =
            JSON.parse(raw);


          return Array.isArray(parsed)
            ? parsed
            : null;

        } catch (error) {

          console.warn(
            'Could not read localStorage cards:',
            error
          );

          return null;

        }

      };


      /* =====================================================
         LOAD cards.json
         
         Exact external JSON file is preferred.
         localStorage remains a fallback for compatibility
         with the existing admin-card system.
         ===================================================== */

      const loadCards = async () => {

        try {

          const response =
            await fetch(
              'cards.json',
              {
                cache: 'no-store'
              }
            );


          if (
            response.ok
          ) {

            const json =
              await response.json();


            if (
              Array.isArray(json)
            ) {

              return json;

            }

          }

        } catch (error) {

          console.warn(
            'Could not load cards.json:',
            error
          );

        }


        const localCards =
          loadLocalCards();


        if (localCards) {

          return localCards;

        }


        return JSON.parse(
          JSON.stringify(
            DEFAULT_CARDS
          )
        );

      };


      /* =====================================================
         URL PARAMETER
         ===================================================== */

      const getParam =
        name => {

          const params =
            new URLSearchParams(
              window.location.search
            );


          return params.get(name);

        };


      /* =====================================================
         DETERMINE IMAGE ORIENTATION
         
         This is based on the actual image dimensions.

         width > height  = landscape
         height > width  = portrait
         equal           = square
         ===================================================== */

      const getImageOrientation =
        (img) => {

          if (
            img.naturalWidth > 0 &&
            img.naturalHeight > 0
          ) {

            if (
              img.naturalHeight >
              img.naturalWidth
            ) {

              return 'portrait';

            }


            if (
              img.naturalWidth >
              img.naturalHeight
            ) {

              return 'landscape';

            }


            return 'square';

          }


          return 'landscape';

        };


      /* =====================================================
         APPLY CORRECT FILM STRIP ORIENTATION
         ===================================================== */

      const detectOrientation =
        img => {

          const wrapper =
            img.closest(
              '.sprocket-wrapper'
            );


          if (!wrapper) {
            return;
          }


          const orientation =
            getImageOrientation(img);


          wrapper.classList.remove(
            'portrait',
            'landscape',
            'square'
          );


          wrapper.classList.add(
            orientation
          );

        };


      /* =====================================================
         GET CURRENT CARD
         ===================================================== */

      const initialiseGallery =
        async () => {

          const cards =
            await loadCards();


          let idx =
            parseInt(
              getParam('i'),
              10
            );


          let card =
            (
              !isNaN(idx) &&
              cards[idx]
            )
              ? cards[idx]
              : null;


          /* -------------------------------------------------
             Optional code lookup
             ------------------------------------------------- */

          if (!card) {

            const code =
              getParam('code');


            if (code) {

              for (
                let k = 0;
                k < cards.length;
                k++
              ) {

                if (
                  cards[k].code === code
                ) {

                  card =
                    cards[k];

                  idx =
                    k;

                  break;

                }

              }

            }

          }


          /* =================================================
             GALLERY INFORMATION
             ================================================= */

          if (!card) {

            document.title =
              'Gallery Not Found — Raffoul Traboulsy';


            $('galTitle').textContent =
              'Gallery not found';


            $('photoStream').innerHTML =
              '<div class="empty">' +
              'This gallery link is missing or the card no longer exists.' +
              '</div>';


            return;

          }


          document.title =
            `${card.title || 'Gallery'} — Raffoul Traboulsy`;


          $('galTitle').textContent =
            card.title || 'Gallery';


          $('galLocation').textContent =
            card.location || '—';


          $('galFormat').textContent =
            card.format || '—';


          $('galYear').textContent =
            card.year || '—';


          $('navCode').textContent =
            card.code || 'Catalogue';


          $('footCode').textContent =
            card.code || 'Catalogue';


          let photos =
            Array.isArray(card.photos)
              ? [...card.photos]
              : [];


          /* =================================================
             FALLBACK TO COVER IMAGE
             ================================================= */

          if (
            !photos.length &&
            card.image
          ) {

            photos = [

              {

                image:
                  card.image,

                alt:
                  card.alt ||
                  card.title ||
                  '',

                caption:
                  card.title ||
                  ''

              }

            ];

          }


          const stream =
            $('photoStream');


          /* =================================================
             NO PHOTOS
             ================================================= */

          if (!photos.length) {

            stream.innerHTML =
              '<div class="empty">' +
              'No photos have been added to this card yet.' +
              '</div>';


            return;

          }


          /* =================================================
             RENDER PHOTOS
             ================================================= */

          stream.innerHTML =
            photos
              .map((photo, i) => {

                const frameLabel =
                  `Frame // ${String(
                    i + 1
                  ).padStart(2, '0')}A`;


                return `

                  <article class="film-frame">

                    <div
                      class="sprocket-wrapper"
                      data-photo-index="${i}">

                      <img
                        src="${escapeHtml(photo.image)}"
                        alt="${escapeHtml(
                          photo.alt || ''
                        )}"
                        loading="lazy">

                    </div>


                    <button
                      type="button"
                      class="expand-btn"

                      data-image="${escapeHtml(
                        photo.image
                      )}"

                      data-alt="${escapeHtml(
                        photo.alt || ''
                      )}"

                      data-caption="${escapeHtml(
                        photo.caption || ''
                      )}"

                      data-frame="${escapeHtml(
                        frameLabel
                      )}">

                      ⛶ Expand

                    </button>


                    <div class="caption">

                      <span>
                        ${escapeHtml(
                          frameLabel
                        )}
                      </span>

                      <span>
                        ${escapeHtml(
                          photo.caption || ''
                        )}
                      </span>

                    </div>

                  </article>

                `;

              })
              .join('');


          /* =================================================
             IMAGE DIMENSION DETECTION
             
             Each image is inspected after loading.
             This means orientation does NOT depend on
             the JSON orientation property.
             ================================================= */

          const images =
            Array.from(
              stream.querySelectorAll(
                '.sprocket-wrapper img'
              )
            );


          images.forEach(img => {

            if (
              img.complete
            ) {

              detectOrientation(img);

            } else {

              img.addEventListener(
                'load',
                () => {

                  detectOrientation(img);

                },
                {
                  once: true
                }
              );

            }

          });

        };


      /* =====================================================
         START GALLERY
         ===================================================== */

      initialiseGallery();


      /* =====================================================
         FULLSCREEN IMAGE VIEWER
         ===================================================== */

      const imageViewer =
        $('imageViewer');


      const viewerImage =
        $('viewerImage');


      const viewerCaption =
        $('viewerCaption');


      const viewerFrame =
        $('viewerFrame');


      const viewerClose =
        $('viewerClose');


      /* =====================================================
         OPEN VIEWER
         ===================================================== */

      const openViewer =
        (
          image,
          alt,
          caption,
          frame
        ) => {

          viewerImage.src =
            image;


          viewerImage.alt =
            alt || '';


          viewerCaption.textContent =
            caption || '';


          viewerFrame.textContent =
            frame || '';


          imageViewer.classList.add(
            'active'
          );


          document.body.style.overflow =
            'hidden';


          viewerClose.focus();

        };


      /* =====================================================
         CLOSE VIEWER
         ===================================================== */

      const closeViewer =
        () => {

          imageViewer.classList.remove(
            'active'
          );


          document.body.style.overflow =
            '';


          setTimeout(
            () => {

              if (
                !imageViewer.classList.contains(
                  'active'
                )
              ) {

                viewerImage.src =
                  '';

              }

            },
            250
          );

        };


      /* =====================================================
         EXPAND BUTTON
         ===================================================== */

      document.addEventListener(
        'click',
        e => {

          const button =
            e.target.closest(
              '.expand-btn'
            );


          if (!button) {
            return;
          }


          openViewer(

            button.dataset.image,

            button.dataset.alt,

            button.dataset.caption,

            button.dataset.frame

          );

        }
      );


      /* =====================================================
         CLOSE VIEWER
         ===================================================== */

      viewerClose.addEventListener(
        'click',
        closeViewer
      );


      /* =====================================================
         CLICK OUTSIDE IMAGE
         ===================================================== */

      imageViewer.addEventListener(
        'click',
        e => {

          if (
            e.target === imageViewer
          ) {

            closeViewer();

          }

        }
      );


      /* =====================================================
         ESCAPE KEY
         ===================================================== */

      document.addEventListener(
        'keydown',
        e => {

          if (
            e.key === 'Escape' &&
            imageViewer.classList.contains(
              'active'
            )
          ) {

            closeViewer();

          }

        }
      );


      /* =====================================================
         SFX SETTING
         
         IMPORTANT:
         This uses the exact same localStorage key
         used by index.html:

             sfxEnabled

         When the value is "false", NO .play()
         call is made.
         ===================================================== */

      const isSoundEnabled =
        () => {

          return (
            localStorage.getItem(
              SFX_KEY
            ) !== 'false'
          );

        };


      /* =====================================================
         BACK TO CATALOGUE
         ===================================================== */

      const backBtn =
        document.querySelector(
          '.back-btn'
        );


      if (backBtn) {

        backBtn.addEventListener(
          'click',
          e => {

            /*
             * Preserve normal browser behaviour
             * for Ctrl/Cmd/Shift/middle click.
             */

            if (
              e.ctrlKey ||
              e.metaKey ||
              e.shiftKey ||
              e.button !== 0
            ) {

              return;

            }


            e.preventDefault();


            const targetUrl =
              backBtn.href;


            /* ===============================================
               SFX OFF
               
               IMPORTANT:
               We immediately navigate.

               No audio element is accessed.
               No currentTime is changed.
               No play() is called.
               =============================================== */

            if (
              !isSoundEnabled()
            ) {

              window.location.replace(
                targetUrl
              );

              return;

            }


            /* ===============================================
               SFX ON
               =============================================== */

            const rollAudio =
              $('roll-audio');


            if (!rollAudio) {

              window.location.replace(
                targetUrl
              );

              return;

            }


            rollAudio.currentTime =
              0;


            const playPromise =
              rollAudio.play();


            /*
             * Give the film-roll sound time to play
             * before returning to the catalogue.
             */

            if (
              playPromise !== undefined
            ) {

              playPromise
                .catch(() => {})
                .finally(() => {

                  setTimeout(
                    () => {

                      window.location.replace(
                        targetUrl
                      );

                    },
                    700
                  );

                });

            } else {

              setTimeout(
                () => {

                  window.location.replace(
                    targetUrl
                  );

                },
                700
              );

            }

          }
        );

      }

    })();

  </script>

</body>

</html>
