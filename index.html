<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RT.CAPTURED.ON.FILM — Gallery</title>

  <link rel="icon" type="image/png" href="images/favicon-mark.png">
  <link rel="apple-touch-icon" href="images/favicon-mark.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap"
    rel="stylesheet">

  <style>

    :root {
      --paper: #E9E1CB;
      --paper-card: #F3EDDC;
      --paper-dark: #D8CCA9;
      --ink: #201C15;
      --ink-muted: #6E6353;
      --stamp: #AC3B2C;
      --teal: #2B554F;
      --line: #B7A97F;
      --radius: 2px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    html,
    body {
      overflow-x: hidden;
    }

    body {
      background: var(--paper);

      background-image:
        radial-gradient(
          circle at 1px 1px,
          rgba(32, 28, 21, 0.045) 1px,
          transparent 0
        );

      background-size: 22px 22px;

      color: var(--ink);

      font-family: 'IBM Plex Sans', sans-serif;

      line-height: 1.55;
    }

    body.modal-open {
      overflow: hidden;
    }

    a {
      color: inherit;
    }

    button {
      font: inherit;
    }

    ::selection {
      background: var(--stamp);
      color: var(--paper-card);
    }

    :focus-visible {
      outline: 2px solid var(--stamp);
      outline-offset: 3px;
    }

    .mono {
      font-family: 'IBM Plex Mono', monospace;
    }

    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 1.75rem;
    }


    /* =====================================================
       PAGE LOAD
       ===================================================== */

    #page-load-shutter {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      display: flex;
      flex-direction: column;
    }

    .load-blade {
      flex: 1;
      width: 100%;

      background-color: var(--ink);

      border-bottom:
        1px solid rgba(255, 255, 255, 0.05);

      transition:
        transform .85s cubic-bezier(.8, 0, .2, 1);
    }

    .load-blade.bottom {
      border-top:
        1px solid rgba(255, 255, 255, 0.05);

      border-bottom: none;
    }

    #page-load-shutter.open .load-blade.top {
      transform: translateY(-100%);
    }

    #page-load-shutter.open .load-blade.bottom {
      transform: translateY(100%);
    }


    /* =====================================================
       MASTHEAD
       ===================================================== */

    .masthead {
      border-bottom: 2px solid var(--ink);
      padding: .9rem 0;
    }

    .masthead-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 1rem;

      font-size: .72rem;
      letter-spacing: .14em;
      text-transform: uppercase;

      color: var(--ink-muted);
    }

    .masthead-row > *:first-child {
      text-align: left;
    }

    .masthead-row > *:last-child {
      text-align: right;
    }

    .masthead-nav {
      text-align: center;
    }

    .masthead-nav a {
      color: inherit;
      text-decoration: none;

      border-bottom: 1px solid transparent;

      cursor: pointer;
    }

    .masthead-nav a:hover {
      color: var(--stamp);
      border-color: var(--stamp);
    }


    /* =====================================================
       SOUND BUTTON
       ===================================================== */

    .sound-toggle {
      justify-self: end;

      width: auto;
      max-width: max-content;

      font-family: 'IBM Plex Mono', monospace;

      font-size: .64rem;

      letter-spacing: .06em;

      text-transform: uppercase;

      color: var(--ink-muted);

      background: none;

      border: 1px solid var(--line);

      padding: .38rem .55rem;

      cursor: pointer;

      border-radius: var(--radius);

      white-space: nowrap;
    }

    .sound-toggle:hover {
      color: var(--stamp);
      border-color: var(--stamp);
      background: var(--paper-card);
    }

    .sound-toggle.muted {
      color: var(--stamp);
      border-color: var(--stamp);
    }


    /* =====================================================
       HERO
       ===================================================== */

    .gallery-hero {
      padding: 4rem 0 3rem;
      text-align: center;
    }

    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: .5rem;

      font-size: .7rem;
      letter-spacing: .2em;
      text-transform: uppercase;

      color: var(--stamp);

      margin-bottom: 1.3rem;
    }

    .hero-eyebrow::before,
    .hero-eyebrow::after {
      content: '';

      width: 26px;
      height: 1px;

      background: var(--stamp);
    }

    #gallery-title {
      font-family: 'Archivo Black', sans-serif;

      font-size: clamp(2.2rem, 6vw, 4.5rem);

      line-height: .95;

      text-transform: uppercase;

      letter-spacing: -.03em;

      margin-bottom: 1rem;
    }

    #gallery-description {
      max-width: 580px;

      margin: 0 auto;

      color: var(--ink-muted);

      font-size: 1rem;
    }


    /* =====================================================
       FILM INFORMATION
       ===================================================== */

    .film-info {
      max-width: 760px;

      margin: 0 auto 3rem;

      border-top: 1px solid var(--line);

      border-bottom: 1px solid var(--line);

      padding: 1rem 0;

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 1rem;

      text-align: center;
    }

    .film-info-item {
      display: flex;
      flex-direction: column;
      gap: .2rem;
    }

    .film-info-label {
      font-family: 'IBM Plex Mono', monospace;

      font-size: .6rem;

      letter-spacing: .12em;

      text-transform: uppercase;

      color: var(--stamp);
    }

    .film-info-value {
      font-family: 'IBM Plex Mono', monospace;

      font-size: .75rem;

      color: var(--ink);
    }


    /* =====================================================
       GALLERY
       ===================================================== */

    .gallery-section {
      padding-bottom: 5rem;
    }

    .gallery-head {
      display: flex;

      align-items: baseline;

      justify-content: space-between;

      border-bottom: 1px solid var(--line);

      padding-bottom: .75rem;

      margin-bottom: 2rem;
    }

    .gallery-head h2 {
      font-family: 'Archivo', sans-serif;

      font-weight: 800;

      font-size: 1.25rem;

      text-transform: uppercase;

      letter-spacing: .03em;
    }

    .gallery-count {
      font-family: 'IBM Plex Mono', monospace;

      font-size: .7rem;

      color: var(--ink-muted);
    }


    /* =====================================================
       VERTICAL FILM STRIP
       ===================================================== */

    .film-strip {
      width: min(760px, 100%);

      margin: 0 auto;

      background: var(--ink);

      border: 1px solid var(--ink);

      padding: 28px 22px;

      position: relative;

      box-shadow:
        0 20px 40px -28px
        rgba(32, 28, 21, .55);
    }

    /*
       Vertical perforations
    */

    .film-strip::before,
    .film-strip::after {
      content: '';

      position: absolute;

      top: 0;
      bottom: 0;

      width: 14px;

      background:
        repeating-linear-gradient(
          to bottom,
          var(--paper-card) 0 7px,
          transparent 7px 18px
        );
    }

    .film-strip::before {
      left: 4px;
    }

    .film-strip::after {
      right: 4px;
    }

    .film-frame {
      position: relative;

      margin: 0 auto 34px;

      padding: 10px;

      background: var(--paper-card);

      border: 1px solid var(--line);

      max-width: 620px;

      transition:
        transform .25s ease,
        box-shadow .25s ease;
    }

    .film-frame:last-child {
      margin-bottom: 0;
    }

    .film-frame:hover {
      transform: translateY(-4px);

      box-shadow:
        0 16px 28px -18px
        rgba(0, 0, 0, .7);
    }


    /* =====================================================
       IMAGE AREA
       ===================================================== */

    .photo-container {
      position: relative;

      width: 100%;

      background: #17140f;

      border: 1px solid var(--ink);

      overflow: hidden;

      display: flex;

      align-items: center;

      justify-content: center;
    }

    .photo-container.landscape {
      aspect-ratio: 3 / 2;
    }

    .photo-container.portrait {
      aspect-ratio: 2 / 3;
    }

    .photo-container.square {
      aspect-ratio: 1 / 1;
    }

    .photo {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;

      cursor: pointer;

      transition:
        transform .45s ease;
    }

    .photo-container:hover .photo {
      transform: scale(1.015);
    }


    /* =====================================================
       FRAME NUMBER
       ===================================================== */

    .photo-number {
      position: absolute;

      top: 9px;
      left: 9px;

      z-index: 3;

      padding: .25rem .4rem;

      background: rgba(32, 28, 21, .8);

      color: var(--paper-card);

      font-family: 'IBM Plex Mono', monospace;

      font-size: .58rem;

      letter-spacing: .05em;
    }


    /* =====================================================
       EXPAND BUTTON
       ===================================================== */

    .expand-button {
      display: block;

      width: 100%;

      margin-top: .65rem;

      padding: .65rem .8rem;

      background: var(--paper-card);

      border: 1px solid var(--ink);

      color: var(--ink);

      font-family: 'IBM Plex Mono', monospace;

      font-size: .65rem;

      letter-spacing: .08em;

      text-transform: uppercase;

      cursor: pointer;

      transition:
        background .2s ease,
        color .2s ease,
        border-color .2s ease;
    }

    .expand-button:hover {
      background: var(--ink);

      color: var(--paper-card);

      border-color: var(--ink);
    }


    /* =====================================================
       CAPTION
       ===================================================== */

    .photo-caption {
      display: flex;

      justify-content: space-between;

      align-items: baseline;

      gap: 1rem;

      padding: .75rem .15rem .1rem;
    }

    .caption-text {
      font-family: 'Archivo', sans-serif;

      font-weight: 700;

      font-size: .9rem;

      color: var(--ink);
    }

    .caption-index {
      font-family: 'IBM Plex Mono', monospace;

      font-size: .58rem;

      color: var(--ink-muted);

      white-space: nowrap;
    }


    /* =====================================================
       FOOTER
       ===================================================== */

    footer {
      border-top: 2px solid var(--ink);

      padding: 2rem 0 3rem;

      text-align: center;
    }

    footer p {
      font-family: 'IBM Plex Mono', monospace;

      font-size: .67rem;

      color: var(--ink-muted);

      letter-spacing: .03em;
    }


    /* =====================================================
       FULLSCREEN VIEWER
       ===================================================== */

    .fullscreen-viewer {
      position: fixed;

      inset: 0;

      z-index: 5000;

      display: flex;

      align-items: center;

      justify-content: center;

      background: rgba(20, 17, 13, .97);

      opacity: 0;

      visibility: hidden;

      pointer-events: none;

      transition:
        opacity .25s ease,
        visibility .25s ease;
    }

    .fullscreen-viewer.active {
      opacity: 1;

      visibility: visible;

      pointer-events: all;
    }

    .viewer-image-wrap {
      width: 100%;
      height: 100%;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 4rem 5rem;
    }

    .viewer-image {
      max-width: 90vw;

      max-height: 84vh;

      width: auto;

      height: auto;

      object-fit: contain;

      box-shadow:
        0 25px 70px rgba(0, 0, 0, .65);

      transform: scale(.96);

      transition:
        transform .3s ease;
    }

    .fullscreen-viewer.active .viewer-image {
      transform: scale(1);
    }

    .viewer-caption {
      position: absolute;

      bottom: 1.5rem;

      left: 50%;

      transform: translateX(-50%);

      color: var(--paper-card);

      font-family: 'IBM Plex Mono', monospace;

      font-size: .72rem;

      letter-spacing: .08em;

      text-transform: uppercase;

      text-align: center;

      width: calc(100% - 8rem);
    }

    .viewer-close {
      position: absolute;

      top: 1.3rem;

      right: 1.5rem;

      z-index: 10;

      background: none;

      border: 1px solid var(--line);

      color: var(--paper-card);

      padding: .5rem .75rem;

      font-family: 'IBM Plex Mono', monospace;

      font-size: .65rem;

      letter-spacing: .08em;

      cursor: pointer;
    }

    .viewer-close:hover {
      border-color: var(--stamp);

      color: var(--stamp);
    }

    .viewer-nav {
      position: absolute;

      top: 50%;

      transform: translateY(-50%);

      z-index: 10;

      width: 42px;

      height: 42px;

      border: 1px solid var(--line);

      background: rgba(32, 28, 21, .8);

      color: var(--paper-card);

      cursor: pointer;

      font-family: 'IBM Plex Mono', monospace;

      font-size: 1rem;
    }

    .viewer-nav:hover {
      border-color: var(--stamp);

      color: var(--stamp);
    }

    .viewer-prev {
      left: 1.5rem;
    }

    .viewer-next {
      right: 1.5rem;
    }


    /* =====================================================
       FLASH
       ===================================================== */

    .flash-overlay {
      position: fixed;

      inset: 0;

      background: white;

      z-index: 10000;

      opacity: 0;

      pointer-events: none;
    }

    .flash-overlay.flash-active {
      animation:
        flashAnim .65s ease-out forwards;
    }

    @keyframes flashAnim {
      0% {
        opacity: 1;
      }

      100% {
        opacity: 0;
      }
    }


    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width: 700px) {

      .wrap {
        padding: 0 1rem;
      }

      .masthead-row {
        grid-template-columns: 1fr;

        gap: .5rem;

        text-align: center;
      }

      .masthead-row > * {
        text-align: center !important;
      }

      .sound-toggle {
        justify-self: center;
      }

      .gallery-hero {
        padding: 3rem 0 2.5rem;
      }

      #gallery-title {
        font-size: clamp(2rem, 12vw, 3.5rem);
      }

      .film-info {
        grid-template-columns: 1fr;

        gap: .7rem;

        padding: 1.2rem;
      }

      .film-strip {
        padding: 20px 17px;
      }

      .film-strip::before,
      .film-strip::after {
        width: 10px;
      }

      .film-strip::before {
        left: 3px;
      }

      .film-strip::after {
        right: 3px;
      }

      .film-frame {
        margin-bottom: 24px;

        padding: 7px;
      }

      .photo-caption {
        flex-direction: column;

        gap: .15rem;
      }

      .viewer-image-wrap {
        padding: 4rem 2rem 5rem;
      }

      .viewer-image {
        max-width: 94vw;

        max-height: 78vh;
      }

      .viewer-prev {
        left: .6rem;
      }

      .viewer-next {
        right: .6rem;
      }

      .viewer-nav {
        width: 36px;

        height: 36px;
      }

      .viewer-caption {
        width: calc(100% - 5rem);

        bottom: 1rem;

        font-size: .6rem;
      }

    }

  </style>

</head>

  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script>

    /*
     * =====================================================
     * GLOBAL DATA
     * =====================================================
     */

    let currentCard = null;

    let photos = [];

    let currentPhotoIndex = 0;


    /*
     * =====================================================
     * DOM ELEMENTS
     * =====================================================
     */

    const filmStrip =
      document.getElementById('film-strip');

    const galleryTitle =
      document.getElementById('gallery-title');

    const galleryDescription =
      document.getElementById('gallery-description');

    const filmCode =
      document.getElementById('film-code');

    const filmLocation =
      document.getElementById('film-location');

    const filmFormat =
      document.getElementById('film-format');

    const galleryCount =
      document.getElementById('gallery-count');

    const fullscreenViewer =
      document.getElementById('fullscreen-viewer');

    const viewerImage =
      document.getElementById('viewer-image');

    const viewerCaption =
      document.getElementById('viewer-caption');

    const viewerClose =
      document.getElementById('viewer-close');

    const viewerPrev =
      document.getElementById('viewer-prev');

    const viewerNext =
      document.getElementById('viewer-next');

    const flash =
      document.getElementById('flash-overlay');

    const soundToggle =
      document.getElementById('sound-toggle');

    const shutterAudio =
      document.getElementById('shutter-audio');

    const rollAudio =
      document.getElementById('roll-audio');

    const backLink =
      document.getElementById('back-link');


    /*
     * =====================================================
     * SOUND SYSTEM
     * =====================================================
     */

    let soundEnabled =
      localStorage.getItem('sfxEnabled') !== 'false';


    function updateSoundButton() {

      if (soundEnabled) {

        soundToggle.textContent =
          '🔊 SFX ON';

        soundToggle.classList.remove('muted');

        soundToggle.setAttribute(
          'aria-label',
          'Mute sound effects'
        );

      } else {

        soundToggle.textContent =
          '🔇 SFX OFF';

        soundToggle.classList.add('muted');

        soundToggle.setAttribute(
          'aria-label',
          'Enable sound effects'
        );

      }

    }


    updateSoundButton();


    soundToggle.addEventListener(
      'click',
      () => {

        soundEnabled = !soundEnabled;

        localStorage.setItem(
          'sfxEnabled',
          soundEnabled
        );

        if (!soundEnabled) {

          shutterAudio.pause();

          shutterAudio.currentTime = 0;

          rollAudio.pause();

          rollAudio.currentTime = 0;

        }

        updateSoundButton();

      }
    );


    function playSound(audio) {

      if (!soundEnabled) {
        return;
      }

      audio.currentTime = 0;

      audio.play().catch(() => {});

    }


    /*
     * =====================================================
     * FLASH EFFECT
     * =====================================================
     */

    function triggerFlash() {

      flash.classList.remove('flash-active');

      void flash.offsetWidth;

      flash.classList.add('flash-active');

    }


    /*
     * =====================================================
     * GET CARD INDEX
     * =====================================================
     */

    function getCardIndex() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const index =
        Number(
          params.get('i')
        );

      if (
        Number.isInteger(index) &&
        index >= 0
      ) {

        return index;

      }

      return 0;

    }


    /*
     * =====================================================
     * LOAD CARDS.JSON
     * =====================================================
     */

    async function loadGallery() {

      try {

        const response =
          await fetch('cards.json', {
            cache: 'no-cache'
          });


        if (!response.ok) {

          throw new Error(
            'Could not load cards.json'
          );

        }


        const cards =
          await response.json();


        if (!Array.isArray(cards)) {

          throw new Error(
            'cards.json must contain an array'
          );

        }


        const cardIndex =
          getCardIndex();


        currentCard =
          cards[cardIndex];


        if (!currentCard) {

          throw new Error(
            'Gallery entry not found'
          );

        }


        photos =
          Array.isArray(currentCard.photos)
            ? currentCard.photos
            : [];


        renderGallery();

      } catch (error) {

        console.error(error);

        galleryTitle.textContent =
          'Gallery Error';

        galleryDescription.textContent =
          'The gallery could not be loaded. Check that cards.json is in the same folder as gallery.html.';

        filmStrip.innerHTML = `
          <div style="
            color: #F3EDDC;
            text-align: center;
            padding: 3rem 1rem;
            font-family: 'IBM Plex Mono', monospace;
            font-size: .75rem;
          ">
            Unable to load gallery.
          </div>
        `;

      }

    }


    /*
     * =====================================================
     * RENDER GALLERY
     * =====================================================
     */

    function renderGallery() {

      galleryTitle.textContent =
        currentCard.title || 'Untitled';


      galleryDescription.textContent =
        currentCard.description || '';


      filmCode.textContent =
        currentCard.code || '—';


      filmLocation.textContent =
        currentCard.location || '—';


      filmFormat.textContent =
        currentCard.format || '—';


      galleryCount.textContent =
        `${photos.length} ${
          photos.length === 1
            ? 'Frame'
            : 'Frames'
        }`;


      filmStrip.innerHTML = '';


      photos.forEach(
        (photo, index) => {

          const frame =
            document.createElement('article');

          frame.className =
            'film-frame';


          /*
           * -----------------------------------------------
           * Determine orientation
           * -----------------------------------------------
           */

          let orientation =
            photo.orientation;


          if (!orientation) {

            orientation =
              'landscape';

          }


          if (
            orientation !== 'portrait' &&
            orientation !== 'square'
          ) {

            orientation =
              'landscape';

          }


          /*
           * -----------------------------------------------
           * Photo container
           * -----------------------------------------------
           */

          const photoContainer =
            document.createElement('div');

          photoContainer.className =
            `photo-container ${orientation}`;


          /*
           * -----------------------------------------------
           * Image
           * -----------------------------------------------
           */

          const image =
            document.createElement('img');

          image.className =
            'photo';

          image.src =
            photo.image;

          image.alt =
            photo.alt || photo.caption || 'Gallery photograph';

          image.loading =
            index === 0
              ? 'eager'
              : 'lazy';


          /*
           * Clicking the image opens fullscreen.
           */

          image.addEventListener(
            'click',
            () => {

              openViewer(index);

            }
          );


          /*
           * -----------------------------------------------
           * Frame number
           * -----------------------------------------------
           */

          const number =
            document.createElement('span');

          number.className =
            'photo-number mono';

          number.textContent =
            String(index + 1).padStart(2, '0');


          photoContainer.appendChild(image);

          photoContainer.appendChild(number);


          /*
           * -----------------------------------------------
           * Expand button
           * -----------------------------------------------
           */

          const expandButton =
            document.createElement('button');

          expandButton.type =
            'button';

          expandButton.className =
            'expand-button';

          expandButton.textContent =
            '⛶ Expand Fullscreen';


          expandButton.setAttribute(
            'aria-label',
            `Expand photo ${index + 1} fullscreen`
          );


          expandButton.addEventListener(
            'click',
            () => {

              openViewer(index);

            }
          );


          /*
           * -----------------------------------------------
           * Caption
           * -----------------------------------------------
           */

          const caption =
            document.createElement('div');

          caption.className =
            'photo-caption';


          const captionText =
            document.createElement('span');

          captionText.className =
            'caption-text';

          captionText.textContent =
            photo.caption || 'Untitled frame';


          const captionIndex =
            document.createElement('span');

          captionIndex.className =
            'caption-index mono';

          captionIndex.textContent =
            `${String(index + 1).padStart(2, '0')} / ${
              String(photos.length).padStart(2, '0')
            }`;


          caption.appendChild(
            captionText
          );

          caption.appendChild(
            captionIndex
          );


          /*
           * -----------------------------------------------
           * Assemble frame
           * -----------------------------------------------
           */

          frame.appendChild(
            photoContainer
          );

          frame.appendChild(
            expandButton
          );

          frame.appendChild(
            caption
          );


          filmStrip.appendChild(
            frame
          );

        }
      );

    }


    /*
     * =====================================================
     * OPEN FULLSCREEN VIEWER
     * =====================================================
     */

    function openViewer(index) {

      if (
        !photos.length ||
        !photos[index]
      ) {

        return;

      }


      currentPhotoIndex =
        index;


      updateViewer();


      fullscreenViewer.classList.add(
        'active'
      );


      fullscreenViewer.setAttribute(
        'aria-hidden',
        'false'
      );


      document.body.classList.add(
        'modal-open'
      );


      triggerFlash();

      playSound(shutterAudio);

    }


    /*
     * =====================================================
     * UPDATE VIEWER
     * =====================================================
     */

    function updateViewer() {

      const photo =
        photos[currentPhotoIndex];


      if (!photo) {
        return;
      }


      viewerImage.src =
        photo.image;


      viewerImage.alt =
        photo.alt ||
        photo.caption ||
        'Gallery photograph';


      viewerCaption.textContent =
        `${String(currentPhotoIndex + 1).padStart(2, '0')} / ${
          String(photos.length).padStart(2, '0')
        } — ${
          photo.caption || 'Untitled frame'
        }`;


      /*
       * Hide navigation buttons when
       * there is only one photograph.
       */

      if (photos.length <= 1) {

        viewerPrev.style.display =
          'none';

        viewerNext.style.display =
          'none';

      } else {

        viewerPrev.style.display =
          'block';

        viewerNext.style.display =
          'block';

      }

    }


    /*
     * =====================================================
     * CLOSE VIEWER
     * =====================================================
     */

    function closeViewer() {

      fullscreenViewer.classList.remove(
        'active'
      );


      fullscreenViewer.setAttribute(
        'aria-hidden',
        'true'
      );


      document.body.classList.remove(
        'modal-open'
      );

    }


    viewerClose.addEventListener(
      'click',
      closeViewer
    );


    /*
     * =====================================================
     * CLICK OUTSIDE IMAGE TO CLOSE
     * =====================================================
     */

    fullscreenViewer.addEventListener(
      'click',
      (event) => {

        if (
          event.target ===
          fullscreenViewer
        ) {

          closeViewer();

        }

      }
    );


    /*
     * =====================================================
     * PREVIOUS PHOTO
     * =====================================================
     */

    viewerPrev.addEventListener(
      'click',
      (event) => {

        event.stopPropagation();


        if (!photos.length) {
          return;
        }


        currentPhotoIndex =
          (
            currentPhotoIndex -
            1 +
            photos.length
          ) %
          photos.length;


        updateViewer();

        triggerFlash();

        playSound(shutterAudio);

      }
    );


    /*
     * =====================================================
     * NEXT PHOTO
     * =====================================================
     */

    viewerNext.addEventListener(
      'click',
      (event) => {

        event.stopPropagation();


        if (!photos.length) {
          return;
        }


        currentPhotoIndex =
          (
            currentPhotoIndex +
            1
          ) %
          photos.length;


        updateViewer();

        triggerFlash();

        playSound(shutterAudio);

      }
    );


    /*
     * =====================================================
     * KEYBOARD CONTROLS
     * =====================================================
     */

    document.addEventListener(
      'keydown',
      (event) => {

        if (
          !fullscreenViewer.classList.contains(
            'active'
          )
        ) {

          return;

        }


        if (
          event.key === 'Escape'
        ) {

          closeViewer();

        }


        if (
          event.key === 'ArrowLeft'
        ) {

          viewerPrev.click();

        }


        if (
          event.key === 'ArrowRight'
        ) {

          viewerNext.click();

        }

      }
    );


    /*
     * =====================================================
     * BACK TO INDEX
     * =====================================================
     */

    backLink.addEventListener(
      'click',
      (event) => {

        if (
          event.ctrlKey ||
          event.metaKey ||
          event.shiftKey ||
          event.button !== 0
        ) {

          return;

        }


        event.preventDefault();


        const targetUrl =
          backLink.href;


        playSound(rollAudio);


        const delay =
          soundEnabled
            ? 700
            : 0;


        setTimeout(
          () => {

            window.location.href =
              targetUrl;

          },
          delay
        );

      }
    );


    /*
     * =====================================================
     * PAGE LOAD SHUTTER
     * =====================================================
     */

    window.addEventListener(
      'load',
      () => {

        setTimeout(
          () => {

            const loadShutter =
              document.getElementById(
                'page-load-shutter'
              );


            if (loadShutter) {

              loadShutter.classList.add(
                'open'
              );

            }

          },
          250
        );

      }
    );


    /*
     * =====================================================
     * BROWSER BACK / BF CACHE
     * =====================================================
     */

    window.addEventListener(
      'pageshow',
      (event) => {

        if (event.persisted) {

          closeViewer();

        }

      }
    );


    /*
     * =====================================================
     * START
     * =====================================================
     */

    loadGallery();

  </script>

</body>

</html>
